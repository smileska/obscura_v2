name: Obscura Messenger CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOCKER_IMAGE: obscura-messenger
  REGISTRY: docker.io

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create test directories
      run: |
        mkdir -p media/chat_images media/chatroom_images media/profile_pics

    - name: Run Django tests
      env:
        SECRET_KEY: 'test-secret-key-for-ci-very-long-and-secure'
        DEBUG: 'True'
        DATABASE_NAME: test_db
        DATABASE_USER: test_user
        DATABASE_PASSWORD: test_password
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        DJANGO_SETTINGS_MODULE: obscura.settings
        ALLOWED_HOSTS: localhost,127.0.0.1,74.248.72.117
      run: |
        python manage.py collectstatic --noinput
        python manage.py migrate
        python manage.py test accounts.tests

    - name: Run code quality checks
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  deploy-to-aks:
    name: deploy-to-aks
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

    - name: Ensure target namespace exists
      run: |
        kubectl get ns obscura-messenger || kubectl create namespace obscura-messenger

    - name: Check cluster resources for single node deployment
      run: |
        echo "============================================"
        echo "CHECKING SINGLE NODE CLUSTER RESOURCES"
        echo "============================================"
        kubectl get nodes -o wide
        kubectl top nodes || echo "Metrics server not available"
        
        echo ""
        echo "Current resource allocation:"
        kubectl describe nodes | grep -A 5 "Allocated resources:" || echo "Node description not available"
        
        PENDING_PODS=$(kubectl get pods --all-namespaces --field-selector=status.phase=Pending --no-headers | wc -l)
        echo ""
        echo "Pending pods in cluster: $PENDING_PODS"
        
        if [ "$PENDING_PODS" -gt 0 ]; then
          echo "WARNING: Found pending pods, checking reasons..."
          kubectl describe pods --all-namespaces --field-selector=status.phase=Pending | grep -A 5 "Events:" | head -20
        fi

    - name: Clean up any resource-starved deployments
      run: |
        echo "Cleaning up any existing failed/pending deployments..."
        kubectl delete pods --field-selector=status.phase=Failed -n obscura-messenger || true
        kubectl delete pods --field-selector=status.phase=Pending -n obscura-messenger || true
        
        kubectl scale deployment backend-app --replicas=0 -n obscura-messenger || true
        kubectl scale deployment frontend-app --replicas=0 -n obscura-messenger || true
        
        sleep 15

    - name: Deploy infrastructure components
      run: |
        echo "Deploying secrets, configs, and storage..."
        kubectl apply -n obscura-messenger -f k8s/secrets.yml
        kubectl apply -n obscura-messenger -f k8s/configmap.yml
        kubectl apply -n obscura-messenger -f k8s/namespace.yml || true
        kubectl apply -n obscura-messenger -f k8s/media-pvc.yml
        kubectl apply -n obscura-messenger -f k8s/postgres-slave-pvcs.yml

    - name: Deploy database services
      run: |
        echo "Deploying optimized database services..."
        kubectl apply -n obscura-messenger -f k8s/postgres-master-statefulset.yml
        kubectl apply -n obscura-messenger -f k8s/redis-deployment.yml

    - name: Wait for database services
      run: |
        echo "Waiting for database services to be ready..."
        kubectl wait --for=condition=ready pod -l app=postgres-master -n obscura-messenger --timeout=600s || {
          echo "PostgreSQL master not ready, checking status..."
          kubectl describe pod -l app=postgres-master -n obscura-messenger
          kubectl logs -l app=postgres-master -n obscura-messenger --tail=30
        }
        
        kubectl wait --for=condition=ready pod -l app=redis -n obscura-messenger --timeout=300s || {
          echo "Redis not ready, checking status..."
          kubectl describe pod -l app=redis -n obscura-messenger  
          kubectl logs -l app=redis -n obscura-messenger --tail=30
        }

    - name: Deploy application services (single replica for single node)
      run: |
        echo "Deploying optimized application services..."
        kubectl apply -n obscura-messenger -f k8s/backend-deployment.yml
        kubectl apply -n obscura-messenger -f k8s/backend-service.yml
        kubectl apply -n obscura-messenger -f k8s/frontend-deployment.yml
        kubectl apply -n obscura-messenger -f k8s/frontend-service.yml
        
        kubectl scale deployment backend-app --replicas=1 -n obscura-messenger
        kubectl scale deployment frontend-app --replicas=1 -n obscura-messenger

    - name: Update backend image to latest
      run: |
        kubectl set image deployment/backend-app django-app=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest -n obscura-messenger

    - name: Wait for application deployments (extended timeout for single node)
      run: |
        echo "Waiting for backend deployment (single node - extended timeout)..."
        kubectl wait --for=condition=available deployment/backend-app -n obscura-messenger --timeout=900s || {
          echo "Backend deployment failed, checking status..."
          echo "=== Deployment Status ==="
          kubectl describe deployment backend-app -n obscura-messenger
          echo "=== Pod Status ==="
          kubectl get pods -l app=backend-app -n obscura-messenger -o wide
          kubectl describe pods -l app=backend-app -n obscura-messenger
          echo "=== Pod Logs ==="
          kubectl logs -l app=backend-app -n obscura-messenger --tail=50
          echo "=== Node Resources ==="
          kubectl top nodes || echo "Node metrics not available"
          exit 1
        }
        
        echo "Waiting for frontend deployment..."
        kubectl wait --for=condition=available deployment/frontend-app -n obscura-messenger --timeout=600s || {
          echo "Frontend deployment failed, checking status..."
          kubectl describe deployment frontend-app -n obscura-messenger
          kubectl get pods -l app=frontend-app -n obscura-messenger -o wide
          kubectl logs -l app=frontend-app -n obscura-messenger --tail=50
          exit 1
        }

    - name: Deploy ingress and networking
      run: |
        echo "Deploying ingress..."
        kubectl apply -n obscura-messenger -f k8s/ingress.yml || echo "Ingress deployment skipped or failed"

    - name: Verify single node deployment
      run: |
        echo "============================================"
        echo "SINGLE NODE DEPLOYMENT VERIFICATION"
        echo "============================================"
        
        echo "All resources:"
        kubectl get all -n obscura-messenger
        
        echo ""
        echo "Pod details:"
        kubectl get pods -n obscura-messenger -o wide
        
        echo ""
        echo "Node resource usage:"
        kubectl top nodes || echo "Node metrics not available"
        
        echo ""
        echo "Pod resource usage:"
        kubectl top pods -n obscura-messenger || echo "Pod metrics not available"
        
        BACKEND_READY=$(kubectl get deployment backend-app -n obscura-messenger -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
        FRONTEND_READY=$(kubectl get deployment frontend-app -n obscura-messenger -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
        
        echo ""
        echo "============================================"
        if [ "$BACKEND_READY" = "1" ] && [ "$FRONTEND_READY" = "1" ]; then
          echo "✅ SUCCESS! Single-node deployment completed successfully"
          echo "Backend: $BACKEND_READY/1 ready"
          echo "Frontend: $FRONTEND_READY/1 ready"
          echo ""
          echo "🎯 RESOURCE OPTIMIZATION SUMMARY:"
          echo "- Backend: 1 replica (was 3)"
          echo "- Frontend: 1 replica (was 2)" 
          echo "- PostgreSQL Master: 100m CPU (was 500m)"
          echo "- Total CPU savings: ~75% reduction"
        else
          echo "❌ DEPLOYMENT INCOMPLETE"
          echo "Backend: $BACKEND_READY/1 ready"
          echo "Frontend: $FRONTEND_READY/1 ready"
          exit 1
        fi

    - name: Provide access information
      run: |
        echo "============================================"
        echo "APPLICATION ACCESS INFORMATION"
        echo "============================================"
        echo "Optimized deployment successful on single-node AKS!"
        echo ""
        echo "Access your application:"
        echo "kubectl port-forward svc/frontend-service 8080:80 -n obscura-messenger"
        echo ""
        echo "Then visit: http://localhost:8080"
        echo ""
        echo "Monitor your application:"
        echo "kubectl get pods -n obscura-messenger"
        echo "kubectl logs -l app=backend-app -n obscura-messenger"
        echo "kubectl top pods -n obscura-messenger"
        echo "============================================"

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest'
        format: 'table'
        exit-code: '0'

    - name: Security scan completed
      run: echo "Security scan completed for ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest"
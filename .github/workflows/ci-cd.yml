name: Obscura Messenger CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOCKER_IMAGE: obscura-messenger
  REGISTRY: docker.io

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create test directories
      run: |
        mkdir -p media/chat_images media/chatroom_images media/profile_pics

    - name: Run Django tests
      env:
        SECRET_KEY: 'test-secret-key-for-ci-very-long-and-secure'
        DEBUG: 'True'
        DATABASE_NAME: test_db
        DATABASE_USER: test_user
        DATABASE_PASSWORD: test_password
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        DJANGO_SETTINGS_MODULE: obscura.settings
        ALLOWED_HOSTS: localhost,127.0.0.1,74.248.72.117
      run: |
        python manage.py collectstatic --noinput
        python manage.py migrate
        python manage.py test accounts.tests

    - name: Run code quality checks
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  deploy-to-aks:
    name: deploy-to-aks
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

    - name: Ensure target namespace exists
      run: |
        kubectl get ns obscura-messenger || kubectl create namespace obscura-messenger

    - name: Update ConfigMap with new image
      run: |
        # Update the backend image in configmap if needed
        kubectl patch configmap django-config -n obscura-messenger --type merge -p '{
          "data": {
            "ALLOWED_HOSTS": "localhost,127.0.0.1,74.248.72.117,obscura-messenger.local,backend-service,*"
          }
        }' || echo "ConfigMap not found, will be created with manifests"

    - name: Deploy manifests
      run: |
        # Apply all Kubernetes manifests
        kubectl apply -n obscura-messenger -f k8s/

    - name: Update backend deployment image
      run: |
        kubectl set image deployment/backend-app django-app=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest -n obscura-messenger

    - name: Verify rollout
      run: |
        kubectl rollout status deployment/backend-app -n obscura-messenger --timeout=300s
        kubectl rollout status deployment/frontend-app -n obscura-messenger --timeout=120s

    - name: Get service info
      run: |
        echo "============================================"
        echo "Deployment successful!"
        echo "Getting service information..."
        kubectl get svc -n obscura-messenger
        echo "============================================"
        echo "Pods status:"
        kubectl get pods -n obscura-messenger
        echo "============================================"

    - name: Get external IP
      run: |
        EXTERNAL_IP=$(kubectl get svc frontend-service -n obscura-messenger -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "Pending")
        echo "External IP: $EXTERNAL_IP"
        echo "Internal access: http://obscura-messenger.local"
        echo "============================================"

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest'
        format: 'table'
        exit-code: '0'

    - name: Security scan completed
      run: echo "Security scan completed for ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest"
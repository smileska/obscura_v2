{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Register - Obscura Messenger{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Create Account</h3>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    
                    <div class="mb-3">
                        <label for="id_image" class="form-label">Profile Picture</label>
                        <input type="file" class="form-control" id="id_image" name="image" accept="image/*">
                        <div class="form-text">Optional. If not provided, a default image will be used.</div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'accounts:login' %}">Already have an account? Log in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

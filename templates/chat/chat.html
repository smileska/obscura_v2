{% extends "base.html" %}
{% load static %}

{% block title %}Chat with {{ chat_partner.username }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <img src="{{ chat_partner.profile.image.url }}" alt="{{ chat_partner.username }}" class="rounded-circle" width="40" height="40">
                        <span class="ms-2 fw-bold">{{ chat_partner.username }}</span>
                        <span class="ms-2 badge {% if chat_partner.profile.status == 'Online' %}bg-success{% else %}bg-secondary{% endif %}">
                            {{ chat_partner.profile.status }}
                        </span>
                    </div>
                </div>

                <div class="card-body">
                    <div id="chat-messages" class="chat-box mb-3"></div>

                    <form id="message-form" class="d-flex flex-column">
                        <div class="d-flex mb-2">
                            <input type="text" id="message-input" class="form-control me-2" placeholder="Type your message...">
                            <button type="button" id="upload-btn" class="btn btn-outline-secondary me-2">
                                <i class="fas fa-image"></i>
                            </button>
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>

                        <div id="image-preview" class="mt-2 d-none">
                            <img id="preview-img" src="" alt="Preview" class="img-thumbnail mb-2" style="max-height: 200px;">
                            <button type="button" id="remove-image-btn" class="btn btn-sm btn-danger">Remove</button>
                        </div>

                        <input type="file" id="image-input" accept="image/*" class="d-none">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const currentUser = "{{ request.user.username }}";
    const chatPartner = "{{ chat_partner.username }}";
    const csrfToken = "{{ csrf_token }}";

    // WebSocket connection
    let socket;
    let socketReady = false;

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socketUrl = `${protocol}//${window.location.host}/ws/chat/`;

        console.log("Connecting to WebSocket:", socketUrl);
        socket = new WebSocket(socketUrl);

        socket.onopen = function(e) {
            console.log("WebSocket connection established successfully!");
            socketReady = true;

            // Send authentication for private chat (no chatroom_id)
            socket.send(JSON.stringify({
                'type': 'authentication',
                'username': currentUser
            }));

            // Load existing messages
            loadMessages();
        };

        socket.onmessage = function(e) {
            console.log("WebSocket message received:", e.data);
            try {
                const data = JSON.parse(e.data);
                console.log("Parsed data:", data);

                if (data.type === 'message') {
                    // Only handle messages related to this private chat
                    if ((data.sender === currentUser && data.recipient === chatPartner) ||
                        (data.sender === chatPartner && data.recipient === currentUser)) {
                        console.log("Adding message to chat:", data);
                        addMessageToChat(data);
                    }
                } else if (data.type === 'reaction') {
                    updateMessageReaction(data.message_id, data.reaction_type);
                }
            } catch (error) {
                console.error("Error parsing WebSocket message:", error);
            }
        };

        socket.onclose = function(e) {
            console.log("WebSocket connection closed. Code:", e.code, "Reason:", e.reason);
            socketReady = false;

            // Attempt to reconnect after 3 seconds
            setTimeout(connectWebSocket, 3000);
        };

        socket.onerror = function(e) {
            console.error("WebSocket error:", e);
            socketReady = false;
        };
    }

    // Load messages from server
    function loadMessages() {
        console.log("Loading messages for chat with:", chatPartner);
        fetch(`/chat/${chatPartner}/messages/`)
            .then(response => {
                console.log("Messages fetch response status:", response.status);
                return response.json();
            })
            .then(messages => {
                console.log("Loaded messages:", messages);
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';

                messages.forEach(message => {
                    addMessageToChat(message);
                });

                // Scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .catch(error => {
                console.error('Error loading messages:', error);
            });
    }

    function addMessageToChat(message) {
        console.log("Adding message to chat:", message);
        const chatMessages = document.getElementById('chat-messages');

        // Check if message with this ID already exists (avoid duplicates)
        if (document.querySelector(`.message[data-message-id="${message.id}"]`)) {
            console.log("Message already exists in chat, skipping");
            return;
        }

        const messageDiv = document.createElement('div');
        const isSentByMe = message.sender === currentUser;

        messageDiv.className = isSentByMe ? 'message message-sent' : 'message message-received';
        messageDiv.dataset.messageId = message.id;
        messageDiv.style.width = '100%';
        messageDiv.style.display = 'flex';
        messageDiv.style.flexDirection = 'column';
        messageDiv.style.alignItems = isSentByMe ? 'flex-end' : 'flex-start';
        messageDiv.style.marginBottom = '16px';
        messageDiv.style.backgroundColor = 'transparent';

        // User info and timestamp
        const infoDiv = document.createElement('div');
        infoDiv.className = 'message-info';
        infoDiv.style.padding = '4px 8px';
        infoDiv.style.borderRadius = '8px';
        infoDiv.style.marginBottom = '4px';
        infoDiv.style.fontSize = '0.8rem';
        infoDiv.style.backgroundColor = isSentByMe ? 'rgba(134, 69, 244, 0.2)' : 'rgba(58, 58, 58, 0.2)';
        infoDiv.style.color = 'black';
        infoDiv.textContent = isSentByMe ? currentUser : message.sender;
        infoDiv.textContent += ' • ' + formatTime(message.timestamp || new Date().toISOString());
        messageDiv.appendChild(infoDiv);

        // Content bubble
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'message-bubble';
        bubbleDiv.style.backgroundColor = isSentByMe ? '#8645f4' : '#3a3a3a';
        bubbleDiv.style.color = 'white';
        bubbleDiv.style.borderRadius = '16px';
        bubbleDiv.style.padding = '10px 14px';
        bubbleDiv.style.maxWidth = '70%';
        bubbleDiv.style.wordWrap = 'break-word';
        bubbleDiv.style.boxShadow = '0 1px 2px rgba(0, 0, 0, 0.1)';

        if (isSentByMe) {
            bubbleDiv.style.borderBottomRightRadius = '4px';
        } else {
            bubbleDiv.style.borderBottomLeftRadius = '4px';
        }

        // Message content
        const messageContent = message.message || message.content || '';
        if (messageContent) {
            const contentP = document.createElement('p');
            contentP.style.margin = '0 0 4px 0';
            contentP.style.color = 'white';
            contentP.textContent = messageContent;
            bubbleDiv.appendChild(contentP);
        }

        // Image if present
        const imageUrl = message.image_url || null;
        if (imageUrl) {
            const img = document.createElement('img');
            img.src = imageUrl;
            img.className = 'message-image';
            img.style.maxWidth = '120px';
            img.style.maxHeight = '120px';
            img.style.borderRadius = '8px';
            img.style.marginTop = '4px';
            img.alt = 'Image';
            bubbleDiv.appendChild(img);
        }

        messageDiv.appendChild(bubbleDiv);

        // Reaction container
        const reactionContainer = document.createElement('div');
        reactionContainer.className = 'reaction-container';
        reactionContainer.style.marginTop = '4px';
        reactionContainer.style.position = 'relative';
        reactionContainer.style.display = 'inline-block';

        const reactionButton = document.createElement('button');
        reactionButton.className = 'reaction-button';
        reactionButton.dataset.messageId = message.id;
        reactionButton.innerHTML = message.reaction_type ? getReactionEmoji(message.reaction_type) : '<i class="far fa-smile"></i>';

        // Create reaction popup
        const reactionPopup = document.createElement('div');
        reactionPopup.className = 'reaction-popup hidden';
        reactionPopup.style.position = 'absolute';
        reactionPopup.style.backgroundColor = 'white';
        reactionPopup.style.borderRadius = '24px';
        reactionPopup.style.padding = '6px 10px';
        reactionPopup.style.zIndex = '100';
        reactionPopup.style.display = 'flex';
        reactionPopup.style.boxShadow = '0 2px 8px rgba(0, 0, 0, 0.15)';
        reactionPopup.style.bottom = '100%';
        reactionPopup.style.marginBottom = '8px';
        reactionPopup.style.border = '1px solid rgba(0, 0, 0, 0.1)';

        // Position popup
        if (isSentByMe) {
            reactionPopup.style.right = '0';
        } else {
            reactionPopup.style.left = '0';
        }

        // Create reaction buttons
        const reactions = [
            { type: 1, emoji: '👍' },
            { type: 2, emoji: '❤️' },
            { type: 3, emoji: '😂' },
            { type: 4, emoji: '😮' },
            { type: 5, emoji: '😢' }
        ];

        reactions.forEach(reaction => {
            const btn = document.createElement('button');
            btn.dataset.reaction = reaction.type;
            btn.innerHTML = reaction.emoji;
            btn.style.background = 'transparent';
            btn.style.border = 'none';
            btn.style.fontSize = '18px';
            btn.style.padding = '6px 8px';
            btn.style.margin = '0 2px';
            btn.style.cursor = 'pointer';
            btn.style.borderRadius = '50%';
            btn.style.width = '36px';
            btn.style.height = '36px';
            btn.style.display = 'flex';
            btn.style.alignItems = 'center';
            btn.style.justifyContent = 'center';

            btn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                const reactionType = this.dataset.reaction;
                if (typeof window.sendReaction === 'function') {
                    window.sendReaction(message.id, reactionType);
                }

                reactionPopup.classList.add('hidden');
            };

            reactionPopup.appendChild(btn);
        });

        // Reaction button click handler
        reactionButton.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();

            // Close all other popups
            document.querySelectorAll('.reaction-popup').forEach(popup => {
                if (popup !== reactionPopup) {
                    popup.classList.add('hidden');
                }
            });

            // Toggle this popup
            reactionPopup.classList.toggle('hidden');
        };

        reactionContainer.appendChild(reactionButton);
        reactionContainer.appendChild(reactionPopup);
        messageDiv.appendChild(reactionContainer);

        chatMessages.appendChild(messageDiv);

        // Scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Send message function
    function sendMessage(messageText, imageUrl = null) {
        if (!socketReady) {
            console.error("WebSocket not ready");
            return false;
        }

        const data = {
            type: 'message',
            sender: currentUser,
            recipient: chatPartner,
            message: messageText,
            image_url: imageUrl
        };

        console.log("Sending message:", data);
        socket.send(JSON.stringify(data));
        return true;
    }

    // Handle image upload
    let currentUploadedImageUrl = null;

    // Message form handler
    document.getElementById('message-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const messageInput = document.getElementById('message-input');
        const message = messageInput.value.trim();

        if (!message && !currentUploadedImageUrl) {
            return;
        }

        if (sendMessage(message, currentUploadedImageUrl)) {
            // Clear inputs only if message was sent successfully
            messageInput.value = '';
            clearImagePreview();
            currentUploadedImageUrl = null;
        }
    });

    // Image upload handlers
    document.getElementById('upload-btn').addEventListener('click', function() {
        document.getElementById('image-input').click();
    });

    document.getElementById('image-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Show preview
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('preview-img').src = e.target.result;
            document.getElementById('image-preview').classList.remove('d-none');
        };
        reader.readAsDataURL(file);

        // Upload the image
        const formData = new FormData();
        formData.append('image', file);
        formData.append('csrfmiddlewaretoken', csrfToken);

        fetch('/chat/upload-image/', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                currentUploadedImageUrl = data.image_url;
            } else {
                console.error('Error uploading image:', data.error);
                clearImagePreview();
            }
        })
        .catch(error => {
            console.error('Error:', error);
            clearImagePreview();
        });
    });

    document.getElementById('remove-image-btn').addEventListener('click', clearImagePreview);

    function clearImagePreview() {
        document.getElementById('image-preview').classList.add('d-none');
        document.getElementById('preview-img').src = '';
        document.getElementById('image-input').value = '';
        currentUploadedImageUrl = null;
    }

    // Send reaction function
    window.sendReaction = function(messageId, reactionType) {
        console.log(`Sending reaction: message=${messageId}, reaction=${reactionType}`);

        const formData = new FormData();
        formData.append('reaction_type', reactionType);
        formData.append('csrfmiddlewaretoken', csrfToken);

        fetch(`/chat/message/${messageId}/react/`, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                console.log("Reaction sent successfully");
                updateMessageReaction(messageId, reactionType);

                // Send via WebSocket for real-time updates
                if (socketReady) {
                    socket.send(JSON.stringify({
                        'type': 'reaction',
                        'message_id': messageId,
                        'reaction_type': reactionType
                    }));
                }
            } else {
                console.error("Error sending reaction:", data.error || "Unknown error");
            }
        })
        .catch(error => console.error('Error sending reaction:', error));
    };

    function updateMessageReaction(messageId, reactionType) {
        const message = document.querySelector(`.message[data-message-id="${messageId}"]`);
        if (!message) {
            return;
        }

        const reactionButton = message.querySelector('.reaction-button');
        if (reactionButton) {
            reactionButton.innerHTML = getReactionEmoji(reactionType);
        }
    }

    function getReactionEmoji(reactionType) {
        const reactions = {
            1: '👍',
            2: '❤️',
            3: '😂',
            4: '😮',
            5: '😢'
        };
        return reactions[reactionType] || '<i class="far fa-smile"></i>';
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    // Close popups when clicking elsewhere
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.reaction-button') && !e.target.closest('.reaction-popup')) {
            document.querySelectorAll('.reaction-popup').forEach(popup => {
                popup.classList.add('hidden');
            });
        }
    });

    // Initialize WebSocket connection when page loads
    document.addEventListener('DOMContentLoaded', function() {
        console.log("DOM loaded, connecting WebSocket...");
        connectWebSocket();
    });
</script>
{% endblock %}

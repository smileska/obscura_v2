apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: obscura-messenger
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Optimize for single node
        client_body_buffer_size 1k;
        client_header_buffer_size 1k;
        client_max_body_size 50M;
        large_client_header_buffers 2 1k;
        
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }
        
        upstream backend {
            server backend-service:8000;
        }
        
        server {
            listen 80;
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            location /static/ {
                alias /app/static/;
                try_files $uri @backend;
                expires 1h;
            }
            
            location /media/ {
                alias /app/media/;
                try_files $uri @backend;
                expires 1h;
            }
            
            location /ws/ {
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 86400;
                proxy_send_timeout 86400;
            }
            
            location @backend {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
            }
            
            location / {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: obscura-messenger
  labels:
    app: frontend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      initContainers:
      - name: wait-for-backend
        image: busybox:1.28
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for backend service..."
          until nc -z backend-service 8000; do
            echo "Backend not ready, waiting 5 seconds..."
            sleep 5
          done
          echo "Backend is ready!"
        resources:
          requests:
            memory: "8Mi"
            cpu: "1m"
          limits:
            memory: "16Mi"
            cpu: "5m"
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: static-storage
          mountPath: /app/static
          readOnly: true
        - name: media-storage
          mountPath: /app/media
          readOnly: true
        resources:
          requests:
            memory: "16Mi"
            cpu: "5m"
          limits:
            memory: "32Mi"
            cpu: "20m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 3"]
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
      - name: static-storage
        persistentVolumeClaim:
          claimName: static-pvc
      - name: media-storage
        persistentVolumeClaim:
          claimName: media-pvc